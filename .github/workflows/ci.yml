# CI (ENG-08): lint + type check + tests on the backend; compose config check.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff format)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy app
      - name: Tests
        run: pytest -q
        env:
          SECRET_KEY: ci-test-secret
          INLINE_JOBS: "true"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q

  # TEST-12 (P1): harness-level end-to-end replay of the frontend flow.
  # Runs the API with SQLite + INLINE_JOBS=true (no Postgres/Redis/Celery
  # needed), then executes every call the Next.js UI makes and asserts the
  # response shapes the components consume. Browser automation (Playwright)
  # is deferred; this pins the API contract the UI depends on.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend
        run: pip install -e ".[dev]"
        working-directory: backend
      - name: Start API (SQLite, inline jobs)
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then echo "API up"; break; fi
            sleep 1
          done
          curl -sf http://localhost:8000/health
        working-directory: backend
        env:
          SECRET_KEY: ci-e2e-secret-not-for-production
          INLINE_JOBS: "true"
      - name: Run UI-flow replay harness
        run: node frontend/e2e/run_flow_test.mjs
