# Local development stack (ENG-05)
# Usage:  docker compose up --build
# The API serves docs at http://localhost:8000/docs, frontend at http://localhost:3000

name: customeriq

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-customeriq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-customeriq-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-customeriq}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-customeriq} -d ${POSTGRES_DB:-customeriq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: dev
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-in-real-deployments}
      DATABASE_URL: postgresql+psycopg://customeriq:${POSTGRES_PASSWORD:-customeriq-dev-password}@db:5432/customeriq
      REDIS_URL: redis://redis:6379/0
      INLINE_JOBS: "false"          # dev stack runs jobs on the Celery worker
      UPLOAD_DIR: /data/uploads
      EXPORTS_DIR: /data/exports
      # browser origin allowed to call the API (CORSMiddleware)
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - uploads:/data/uploads
      - exports:/data/exports
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Run migrations, then start the API
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    environment:
      ENVIRONMENT: dev
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-in-real-deployments}
      DATABASE_URL: postgresql+psycopg://customeriq:${POSTGRES_PASSWORD:-customeriq-dev-password}@db:5432/customeriq
      REDIS_URL: redis://redis:6379/0
      INLINE_JOBS: "false"
      UPLOAD_DIR: /data/uploads
      EXPORTS_DIR: /data/exports
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - uploads:/data/uploads
      - exports:/data/exports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app:app worker --loglevel=INFO --concurrency=2

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
  exports:
